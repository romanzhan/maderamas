# Сборка и заливка витрины на хостинг.
# Собирает то же самое, что `npm run build` на машине: проверка данных → генерация
# страниц товаров и статей → Vite → карта сайта, robots и правила сервера.
#
# PREVIEW=1 — это превью для приёмки: robots.txt и заголовок закрывают его от поиска,
# чтобы копия магазина не конкурировала с настоящим сайтом за собственный бренд
# (seo.md п. 9).
name: Публикация сайта

on:
  push:
    branches: [main]
  workflow_dispatch:

# Одна заливка за раз: вторая дожидается первой, а не обгоняет её на полпути
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
        env:
          PREVIEW: '1'

      # Заливка идёт с --delete: на сервере остаётся ровно то, что в сборке. Значит
      # пустая или неполная сборка стёрла бы сайт. Проверяем до того, как трогать сервер
      - name: Сборка на месте
        run: |
          test -n "${{ secrets.DEPLOY_PATH }}" || { echo 'Пустой путь заливки'; exit 1; }
          test -s dist/index.html || { echo 'Нет главной страницы'; exit 1; }
          test -s dist/.htaccess || { echo 'Нет правил сервера'; exit 1; }
          test -s dist/api/index.php || { echo 'Нет сервера заказов'; exit 1; }
          test -s dist/api/runtime.json || { echo 'Нет runtime.json для сервера'; exit 1; }
          pages=$(find dist -name index.html | wc -l)
          echo "Страниц в сборке: $pages"
          [ "$pages" -ge 30 ] || { echo 'Страниц меньше, чем должно быть'; exit 1; }

      - name: Ключ и отпечаток сервера
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      # Правила сервера (.htaccess) лежат в самой сборке и приезжают вместе с ней:
      # дописывать их отдельным шагом после --delete значит оставить сайт без своей
      # страницы 404, а при сбое того шага — оставить насовсем
      # Хостинг время от времени не отвечает GitHub по SSH (тайм-аут соединения,
      # 03.09.2026 — трижды за вечер); со второй попытки через минуту проходит.
      # Повторяем сами, чтобы не перезапускать всю сборку руками
      - name: Заливка на хостинг
        run: |
          for attempt in 1 2 3; do
            rsync -az --delete --chmod=D755,F644 \
              -e "ssh -i ~/.ssh/deploy -p ${{ secrets.SSH_PORT }} -o UserKnownHostsFile=~/.ssh/known_hosts -o ConnectTimeout=30" \
              dist/ "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/" && exit 0
            echo "Попытка $attempt не прошла, ждём минуту"
            sleep 60
          done
          echo 'Хостинг не принял заливку за три попытки'
          exit 1

      # Проверяем не только «страница открылась»: несуществующий адрес обязан отдать 404
      # своей страницей (значит .htaccess доехал), а превью — остаться закрытым от поиска
      - name: Проверка
        run: |
          site=https://dev.maderamas.com.ar
          fail=0
          for path in / /sillas/ /sillas/silla-evolutiva/ /carrito/ /checkout/ /blog/ /contacto/; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$site$path")
            echo "$code $path"
            [ "$code" = 200 ] || fail=1
          done

          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$site/no-existe-xyz/")
          echo "$code /no-existe-xyz/ (ждём 404)"
          [ "$code" = 404 ] || fail=1

          # Сервер заказов (бэкенд.md §10): отвечает сам и не отдаёт своих файлов
          curl -s --max-time 20 "$site/api/health" | grep -q '"ok":true' \
            || { echo 'сервер заказов не отвечает на /api/health'; fail=1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$site/api/runtime.json")
          echo "$code /api/runtime.json (ждём не 200)"
          [ "$code" != 200 ] || fail=1

          curl -s --max-time 20 "$site/robots.txt" | grep -qx 'Disallow: /' \
            || { echo 'robots.txt не закрывает превью'; fail=1; }
          curl -sI --max-time 20 "$site/" | grep -qi 'x-robots-tag: *noindex' \
            || { echo 'нет заголовка noindex'; fail=1; }

          exit $fail
